# Build APK release sau mỗi lần push, và cho pull request. APK nằm ở mục Artifacts của lần chạy.
#
# Ký APK: bản release ký bằng khoá debug (app/build.gradle). Máy chủ CI tự tạo khoá debug mới mỗi lần nên APK
# không cài đè được lên app đã cài từ máy khác. Muốn cùng chữ ký với máy mình thì lưu khoá debug vào secret
# DEBUG_KEYSTORE_BASE64 (base64 của ~/.android/debug.keystore); workflow giải mã ra file và trỏ SPHERE360_KEYSTORE
# tới đó. Bước "Chữ ký APK" in vân tay SHA-256 để đối chiếu.
name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 28.2.13676358
  CMAKE_VERSION: 4.1.2
  OPENCV_VERSION: 4.14.0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Cài NDK, CMake, SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" > /dev/null

      - name: Cache OpenCV Android SDK
        id: opencv-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/OpenCV-android-sdk
          key: opencv-android-${{ env.OPENCV_VERSION }}

      - name: Tải OpenCV Android SDK
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/opencv.zip" \
            "https://github.com/opencv/opencv/releases/download/${OPENCV_VERSION}/opencv-${OPENCV_VERSION}-android-sdk.zip"
          unzip -q "$RUNNER_TEMP/opencv.zip" -d "$RUNNER_TEMP"
          rm "$RUNNER_TEMP/opencv.zip"

      - name: Khoá ký (nếu có secret)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            echo "SPHERE360_KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
            echo "Ký bằng khoá debug từ secret DEBUG_KEYSTORE_BASE64."
          else
            echo "::warning::Chưa có secret DEBUG_KEYSTORE_BASE64: APK ký bằng khoá debug của máy CI, không cài đè được lên app đã cài."
          fi

      - name: Build APK release
        env:
          OPENCV_ANDROID_SDK: ${{ runner.temp }}/OpenCV-android-sdk
        run: ./gradlew assembleRelease --no-daemon

      - name: Chữ ký APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs             app/build/outputs/apk/release/app-release.apk | grep -E "DN:|SHA-256"

      - name: Đặt tên APK
        id: apk
        run: |
          name="Sphere360-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 30
